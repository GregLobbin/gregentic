<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>GregGentic · Market Health Check</title>
<meta property="og:title" content="GregGentic · Market Health Check">
<meta property="og:description" content="A monthly one-page read on the market for a long-term investor: the overall signal, the dry-powder call, and what would change it.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1b2e;--bg2:#132338;--bg3:#172a42;
  --border:#264566;--accent:#38c4e3;--accent2:#22c55e;
  --text:#ecf4fc;--dim:#b4cbe0;--muted:#8eaac4;
  --green:#2ecc71;--yellow:#f5b031;--red:#ff6b6b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:var(--accent)}
a:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
#hdr{background:var(--bg2);border-bottom:2px solid var(--accent);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
#logo{font-family:var(--mono);color:var(--accent);font-size:18px;font-weight:bold;letter-spacing:4px;text-decoration:none}
#logo em{color:var(--accent2);font-style:normal}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hbtn{font-family:var(--mono);border:1px solid var(--border);color:var(--dim);font-size:13px;padding:6px 12px;letter-spacing:1px;text-decoration:none}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
select{background:var(--bg3);color:var(--text);border:1px solid var(--accent);cursor:pointer;font-family:var(--sans);font-size:15px;padding:6px 8px;max-width:100%}

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 28px;display:grid;gap:22px}
#app{display:grid;gap:22px}

/* section header */
.sh{font-family:var(--mono);font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);padding:0 0 8px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh .aside{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.blk{display:grid;gap:12px;align-content:start}
.two>.blk{grid-template-rows:auto 1fr}
.card{background:var(--bg2);border:1px solid var(--border);padding:18px 20px}
.lbl{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}

/* signal */
.sig{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.sig.green{background:var(--green)}.sig.yellow{background:var(--yellow)}.sig.red{background:var(--red)}
.chip{font-family:var(--mono);font-size:13px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border:1.5px solid currentColor;white-space:nowrap;display:inline-block}
.chip.green{color:var(--green)}.chip.yellow{color:var(--yellow)}.chip.red{color:var(--red)}.chip.acc{color:var(--accent)}

/* hero */
.hero{border-left:5px solid var(--yellow);display:grid;gap:12px}
.hero.green{border-left-color:var(--green)}.hero.red{border-left-color:var(--red)}
.kick{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.kick .lbl{color:var(--dim);font-size:13px}
.hero h1{font-size:30px;line-height:1.2;font-weight:700;max-width:38ch}
.hero .sum{font-size:18px;line-height:1.6;max-width:68ch}
.meta{font-size:14px;color:var(--muted)}

/* dry powder */
.pw-top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.pw-name{font-size:26px;font-weight:700}
.pw-chg{font-size:14px;color:var(--yellow)}
.pw-same{font-size:14px;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0 4px}
.rung{padding:9px 4px;background:var(--bg);border:1px solid var(--border);text-align:center;display:grid;gap:1px;min-width:0}
.rung b{font-family:var(--mono);font-size:14px;letter-spacing:.5px;color:var(--dim)}
.rung small{font-size:12px;color:var(--muted)}
.rung.on{background:var(--accent);border-color:var(--accent)}
.rung.on b,.rung.on small{color:#04121f}
.axis{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px;gap:10px}
.action{font-size:18px;line-height:1.55;max-width:68ch}
.dist{font-size:16px;color:var(--dim);margin-top:8px}
.ruler{margin:10px 0 2px}
.ruler svg{width:100%;height:auto;display:block}
.note{font-size:15px;color:var(--dim);border-top:1px dashed var(--border);padding-top:10px;margin-top:12px;max-width:72ch}
@media(max-width:520px){.rung b{font-size:13px}.rung small{display:none}.pw-name{font-size:22px}.hero h1{font-size:26px}#hdr{position:static}#pick-lbl{display:none}}

/* key numbers */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--bg2);border:1px solid var(--border);padding:14px 16px;display:grid;gap:4px;align-content:start;text-decoration:none;color:inherit;min-width:0}
.tile .name{font-size:15px;font-weight:600;color:var(--dim)}
a.tile:hover{background:var(--bg3)}
.tile .top{display:flex;align-items:center;gap:7px}
.tile .ext{margin-left:auto;color:var(--muted);font-size:13px}
.tile .v{font-family:var(--mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .dl{font-size:14px;color:var(--dim)}
.tile .s{font-size:14px;color:var(--dim);line-height:1.4}
.tile .now{font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px;margin-top:4px}
.spark{width:100%;height:30px;display:block}
.rf{background:none;border:1px solid var(--accent2);color:var(--accent2);font-family:var(--mono);font-size:12px;letter-spacing:1px;padding:3px 9px;cursor:pointer}
.rf:hover{background:var(--accent2);color:#04121f}
.rf[disabled]{opacity:.5;cursor:wait}
@media(max-width:400px){.tile .v{font-size:21px}}

/* two columns */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
ul.l{padding-left:20px;display:grid;gap:9px;font-size:16px}
ul.l li::marker{color:var(--accent)}
.olrow{display:grid;grid-template-columns:62px 1fr;gap:2px 14px;padding:12px 0;border-bottom:1px solid var(--border)}
.olrow:first-child{padding-top:2px}.olrow:last-child{border-bottom:none}
.olrow .hz{grid-row:span 2;font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);line-height:1.1}
.olrow .hz small{display:block;font-size:12px;color:var(--muted);letter-spacing:1px;font-weight:normal}
.olrow .lean{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.olrow p{font-size:15px;color:var(--dim)}

/* street view */
.cons{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline}
.cons b{font-size:17px}
.cons .p{flex-basis:100%;font-size:15px;color:var(--dim)}
.firms{border:1px solid var(--border);background:var(--bg2)}
.frow{display:grid;grid-template-columns:1.2fr 1fr 1.3fr 1.7fr;gap:6px 18px;padding:13px 18px;border-bottom:1px solid var(--border);align-items:start;font-size:15px}
.frow:last-child{border-bottom:none}
.frow.head{padding:9px 18px;background:var(--bg3)}
.frow .firm a{font-weight:700;color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted)}
.frow .firm a:hover{color:var(--accent);border-color:var(--accent)}
.frow .firm .d{display:block;font-size:13px;color:var(--muted)}
.frow .fitc{display:grid;gap:5px;justify-items:start}
.frow .fitc .chip{font-size:12px}
.frow .fitc span:last-child{font-size:14px;color:var(--dim)}
.frow .mob{display:none}
@media(max-width:720px){.frow{grid-template-columns:1fr;gap:4px}.frow.head{display:none}.frow .mob{display:inline;margin-right:8px}}
.houses{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.house{display:grid;gap:8px;align-content:start}
.hh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.hh a,.hh b{font-size:17px;font-weight:700;color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted)}
.hh a:hover{color:var(--accent);border-color:var(--accent)}
.hh .d{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:15px;align-items:baseline}
.house p{font-size:15px;color:var(--dim)}
.q{font-style:italic;color:var(--text)!important;border-left:3px solid var(--border);padding-left:10px}
.fit{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--border);padding-top:9px;margin-top:2px}
.fit .chip{font-size:12px;flex:none}
.fit span:last-child{font-size:14px;color:var(--dim)}
.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.voice{display:grid;gap:6px;align-content:start}
.voice .q{font-size:17px}
.voice .who{font-size:14px;color:var(--muted)}
.voice p{font-size:15px;color:var(--dim)}
.small-note{font-size:14px;color:var(--muted)}

/* triggers */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:820px){.three{grid-template-columns:1fr}}
.three h3{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.three ul.l{font-size:15px}

/* detail */
details.more{border:1px solid var(--border);background:var(--bg2)}
details.more>summary{cursor:pointer;padding:14px 18px;font-family:var(--mono);font-size:14px;letter-spacing:1px;color:var(--accent);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'＋ SHOW'}
details.more[open]>summary::after{content:'－ HIDE'}
details.more>summary small{font-family:var(--sans);letter-spacing:0;color:var(--muted);font-size:13px}
.dbody{padding:4px 18px 18px;display:grid;gap:22px}
.dbody h3{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.watch{display:grid;gap:8px}
.w{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px}
.w .sig{margin-top:7px}
.w p{grid-column:2;color:var(--dim)}
.tbl{overflow-x:auto;border:1px solid var(--border)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;background:var(--bg3);border-bottom:1px solid var(--border);font-weight:normal}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
td.n{font-variant-numeric:tabular-nums}
td a{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted)}
td a:hover{color:var(--accent);border-bottom-color:var(--accent)}
td .chip{font-size:12px;padding:1px 7px}
.src{columns:2 300px;column-gap:28px;font-size:14px;padding-left:20px}
.src li{break-inside:avoid;margin-bottom:5px}

.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:12px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.msg{padding:30px 14px;text-align:center;color:var(--dim);border:1px dashed var(--border)}
</style>
</head>
<body>
<div id="hdr">
  <a id="logo" href="/">GREG<em>ENTIC</em></a>
  <div class="hr">
    <label class="lbl" for="pick" id="pick-lbl">Report</label>
    <select id="pick"><option>Loading…</option></select>
    <a class="hbtn" href="/">◀ ALL APPS</a>
  </div>
</div>

<div class="wrap">
  <div id="app"><div class="msg">Loading report…</div></div>
  <div class="foot"><span>GREGENTIC.COM // MARKET HEALTH CHECK v2.0</span><span>A data read, not financial advice. Report values are as of each report date.</span></div>
</div>

<script>
const WORKER_URL='https://gregentic-data.lobbingr.workers.dev';
const LADDER=[{s:-2,n:'Deploy+',d:'aggressive'},{s:-1,n:'Deploy',d:'gradual'},{s:0,n:'Hold',d:'no change'},{s:1,n:'Build',d:'steady'},{s:2,n:'Build+',d:'aggressive'}];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sig=s=>el('span','sig '+(s||''));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS='http://www.w3.org/2000/svg';
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
const fmtShort=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtMonth=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
const link=(txt,href)=>{const a=el('a',null,txt);a.href=href;a.target='_blank';a.rel='noopener';return a};
function section(title,...kids){const s=el('section','blk');const h=el('div','sh');h.append(el('span',null,title));s.append(h,...kids);return s}

function sparkSvg(vals,color,label){
  if(!vals||vals.length<2)return null;
  const W=150,H=30,P=3,lo=Math.min(...vals),hi=Math.max(...vals),rg=hi-lo||1;
  const X=i=>P+i*(W-2*P)/(vals.length-1),Y=v=>H-P-(v-lo)/rg*(H-2*P);
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('class','spark');svg.setAttribute('role','img');svg.setAttribute('aria-label',label||'trend');
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const mk=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);svg.append(n)};
  mk('polygon',{points:`${X(0)},${H} ${pts} ${X(vals.length-1)},${H}`,fill:color,opacity:.12});
  mk('polyline',{points:pts,fill:'none',stroke:color,'stroke-width':1.5,'vector-effect':'non-scaling-stroke','stroke-linejoin':'round'});
  mk('circle',{cx:X(vals.length-1),cy:Y(vals.at(-1)),r:2.5,fill:color});
  return svg;
}

// ── INDICATORS (report snapshot + live) ──
const IND=[
  {key:'sp500',sym:'^GSPC',label:'S&P 500',kind:'pct',fmt:v=>v.toLocaleString('en-US',{maximumFractionDigits:0}),yh:'%5EGSPC'},
  {key:'y10',sym:'^TNX',label:'10-yr Treasury',kind:'pts',inv:true,fmt:v=>v.toFixed(2)+'%',yh:'%5ETNX'},
  {key:'y30',sym:'^TYX',label:'30-yr Treasury',kind:'pts',inv:true,fmt:v=>v.toFixed(2)+'%',yh:'%5ETYX'},
  {key:'bill13',sym:'^IRX',label:'Cash (13-wk bill)',kind:'pts',fmt:v=>v.toFixed(2)+'%',yh:'%5EIRX'},
  {key:'brent',sym:'BZ=F',label:'Brent oil',kind:'pct',inv:true,fmt:v=>'$'+v.toFixed(2),yh:'BZ%3DF'},
  {key:'btc',sym:'BTC-USD',label:'Bitcoin',kind:'pct',fmt:v=>'$'+Math.round(v).toLocaleString(),yh:'BTC-USD'},
  {key:'vix',sym:'^VIX',label:'VIX (fear gauge)',kind:'pct',inv:true,fmt:v=>v.toFixed(1),yh:'%5EVIX'}
];
const num=x=>typeof x==='number'?x:(x&&typeof x.v==='number'?x.v:null);
function chg(I,now,then){
  if(now==null||then==null)return null;
  const diff=I.kind==='pts'?(now-then):(now-then)/Math.abs(then)*100;
  const flat=Math.abs(diff)<(I.kind==='pts'?0.01:0.1);
  const txt=I.kind==='pts'?Math.abs(diff).toFixed(2)+' pts':Math.abs(diff).toFixed(1)+'%';
  return flat?'unchanged':(diff>0?'▲ ':'▼ ')+txt;
}

let live={},liveSeries={},cur=null,prev=null,liveBusy=false,liveAt=0,liveFull=false;
async function loadLive(){
  if(liveBusy)return;liveBusy=true;setLiveStatus('updating…');
  let full=false;
  try{
    const r=await fetch(`${WORKER_URL}/history`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();let n=0;
    IND.forEach(I=>{const s=d[I.sym];if(!s||s.error||!s.c?.length)return;n++;liveSeries[I.key]={...s,span:'52wk'};live[I.key]=s.price??s.c.at(-1)});
    if(!n)throw new Error('no series');full=true;
  }catch(e){
    await Promise.all([
      (async()=>{try{
        const r=await fetch(`${WORKER_URL}/markets`);if(!r.ok)return;const d=await r.json();
        [['^GSPC','sp500'],['BZ=F','brent'],['^TYX','y30']].forEach(([sym,key])=>{
          const res=d[sym]?.chart?.result?.[0];if(!res)return;
          const ts=res.timestamp||[],cl=res.indicators?.quote?.[0]?.close||[];
          const pts=ts.map((t,i)=>[t,cl[i]]).filter(p=>p[1]!=null);
          const price=res.meta?.regularMarketPrice??pts.at(-1)?.[1];if(price==null)return;
          liveSeries[key]={t:pts.map(p=>p[0]),c:pts.map(p=>p[1]),price,span:'7d'};live[key]=price;
        });
      }catch(_){}})(),
      (async()=>{try{
        const r=await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily');if(!r.ok)return;
        const d=await r.json();const pr=(d.prices||[]).filter((_,i,a)=>i%7===0||i===a.length-1);
        if(pr.length){liveSeries.btc={t:pr.map(p=>Math.floor(p[0]/1000)),c:pr.map(p=>p[1]),price:pr.at(-1)[1],span:'52wk'};live.btc=pr.at(-1)[1]}
      }catch(_){}})()
    ]);
  }
  liveFull=full;liveAt=Date.now();liveBusy=false;
  renderTiles();
}
function liveStatusText(){
  const n=Object.keys(live).length;
  if(liveBusy)return 'updating…';
  if(!liveAt)return 'loading live prices…';
  if(!n)return 'live prices unavailable';
  const t=new Date(liveAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return `Live prices ${t}`+(liveFull?'':` (${n} of ${IND.length})`)+' · lines show 52 weeks';
}
function setLiveStatus(){const s=document.getElementById('live-st');if(s)s.textContent=liveStatusText();const b=document.getElementById('lv-btn');if(b)b.disabled=liveBusy}

// ── KEY NUMBERS: report value, change vs last report, live now ──
function renderTiles(){
  const box=document.getElementById('tiles');if(!box||!cur){setLiveStatus();return}
  box.replaceChildren();
  const S=cur.snapshot||{},P=prev?.snapshot||{};
  IND.forEach(I=>{
    const x=S[I.key],v=num(x);
    const t=el('a','tile');t.href=`https://finance.yahoo.com/quote/${I.yh}/`;t.target='_blank';t.rel='noopener';t.title='Open chart';
    const top=el('div','top');top.append(sig(x?.signal),el('span','name',I.label),el('span','ext','↗'));
    t.append(top,el('div','v',v==null?'n/a':I.fmt(v)));
    if(prev){const c=chg(I,v,num(P[I.key]));t.append(el('div','dl',c?c+' vs '+fmtShort(prev.date):'no earlier reading'))}
    if(x?.note)t.append(el('div','s',x.note));
    const L=live[I.key],sr=liveSeries[I.key];
    if(L!=null&&v!=null){
      const c=chg(I,L,v);t.append(el('div','now','Now '+I.fmt(L)+(c&&c!=='unchanged'?' · '+c:'')));
      if(sr){const pct=(L-sr.c[0])/Math.abs(sr.c[0])*100,good=I.inv?pct<0:pct>0;const col=Math.abs(pct)<0.5?css('--muted'):good?css('--green'):css('--red');const g=sparkSvg(sr.c,col,`${I.label} trend`);if(g)t.append(g)}
    }
    box.append(t);
  });
  setLiveStatus();
}

// ── PULLBACK RULER (drawn at real pixel width so text stays readable on phones) ──
function ruler(p,Wpx){
  const W=Math.round(Math.max(300,Math.min(980,Wpx))),narrow=W<560,H=98,pad=narrow?18:36,minPct=-25;
  const x=v=>pad+(v-minPct)/(0-minPct)*(W-2*pad);
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const dd=(p.level/p.ath-1)*100;svg.setAttribute('role','img');svg.setAttribute('aria-label',`S&P 500 is ${Math.abs(dd).toFixed(1)}% below its record high`);
  const add=(t,a,tx)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(tx!=null)n.textContent=tx;svg.append(n)};
  const G=css('--green'),Y=css('--yellow'),D=css('--dim'),M=css('--muted'),A=css('--accent'),B=css('--border'),F=css('--sans');
  add('rect',{x:x(-25),y:36,width:x(-20)-x(-25),height:14,fill:G,opacity:.6});
  add('rect',{x:x(-20),y:36,width:x(-10)-x(-20),height:14,fill:G,opacity:.3});
  add('rect',{x:x(-10),y:36,width:x(0)-x(-10),height:14,fill:css('--bg3')});
  const ticks=narrow?[-20,-10,0]:[-25,-20,-15,-10,-5,0];
  ticks.forEach(t=>{add('line',{x1:x(t),x2:x(t),y1:32,y2:54,stroke:B,'stroke-width':1.5});
    add('text',{x:x(t),y:71,'text-anchor':t===0?'end':'middle','font-size':13,fill:D,'font-family':F},t===0?'Record':t+'%');
    if(t<0)add('text',{x:x(t),y:89,'text-anchor':'middle','font-size':13,fill:M,'font-family':F},Math.round(p.ath*(1+t/100)).toLocaleString())});
  if(narrow)add('text',{x:(x(-25)+x(-10))/2,y:26,'text-anchor':'middle','font-size':13,fill:G,'font-family':F,'font-weight':'bold'},'BUY ZONE');
  else{add('text',{x:(x(-25)+x(-20))/2,y:26,'text-anchor':'middle','font-size':13,fill:G,'font-family':F,'font-weight':'bold'},'BUY MORE');
       add('text',{x:(x(-20)+x(-10))/2,y:26,'text-anchor':'middle','font-size':13,fill:G,'font-family':F,'font-weight':'bold'},'BUY ZONE')}
  const mx=x(Math.max(minPct,Math.min(0,dd)));
  add('line',{x1:mx,x2:mx,y1:30,y2:56,stroke:A,'stroke-width':3});add('circle',{cx:mx,cy:43,r:6,fill:A});
  const lbl=`Now ${Math.round(p.level).toLocaleString()} (${dd.toFixed(1)}%)`;
  add('text',{x:Math.min(mx+8,W-pad),y:26,'text-anchor':mx>W*0.6?'end':'start','font-size':13,fill:A,'font-family':F,'font-weight':'bold'},lbl);
  return svg;
}
function drawRuler(){const b=document.getElementById('ruler');if(!b||!cur?.pullback)return;b.replaceChildren(ruler(cur.pullback,b.clientWidth||600))}
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(drawRuler,150)});

// ── REPORT ──
function render(r){
  const app=document.getElementById('app');app.replaceChildren();

  // 1. Bottom line
  const hero=el('section','card hero '+(r.overall?.signal||''));
  const k=el('div','kick');k.append(el('span','chip '+(r.overall?.signal||''),r.overall?.label||''),el('span','lbl','Market Health Check · '+fmtMonth(r.date)));
  hero.append(k,el('h1',null,r.overall?.headline||''),el('p','sum',r.overall?.text||''));
  hero.append(el('div','meta','Data as of '+(r.dataAsOf||fmtDate(r.date))+(prev?' · compared with the '+fmtDate(prev.date)+' report':' · first report')));
  app.append(hero);

  // 2. What to do
  const pw=el('div','card');
  const pt=el('div','pw-top');pt.append(el('span','lbl','Dry-powder call'),el('span','pw-name',r.powder?.label||''));
  if(prev?.powder?.label)pt.append(prev.powder.label!==r.powder?.label?el('span','pw-chg','Changed from '+prev.powder.label):el('span','pw-same','Unchanged from last report'));
  const lad=el('div','ladder');LADDER.forEach(x=>{const g=el('div','rung'+(x.s===r.powder?.score?' on':''));g.append(el('b',null,x.n),el('small',null,x.d));lad.append(g)});
  const ax=el('div','axis');ax.append(el('span',null,'◀ move cash into stocks'),el('span',null,'add to Bond Plus ▶'));
  pw.append(pt,lad,ax,el('p','action',r.powder?.action||''));
  if(r.pullback?.ath&&r.pullback?.level){
    const p=r.pullback,dd=(1-p.level/p.ath)*100,zone=p.ath*0.9,need=(1-zone/p.level)*100;
    pw.append(el('p','dist',need>0?`The S&P is ${dd.toFixed(1)}% below its record. The buy zone starts about ${need.toFixed(0)}% lower, near ${Math.round(zone).toLocaleString()}.`:`The S&P is ${dd.toFixed(1)}% below its record — inside the buy zone.`));
    const rb=el('div','ruler');rb.id='ruler';pw.append(rb);
  }
  if(r.powder?.note)pw.append(el('p','note',r.powder.note));
  app.append(section('What to do',pw));

  // 3. Key numbers
  const kn=el('section','blk'),kh=el('div','sh');kh.append(el('span',null,'Key numbers'));
  const aside=el('span','aside');const st=el('span',null,'');st.id='live-st';const btn=el('button','rf','⟳ Refresh');btn.id='lv-btn';btn.type='button';btn.title='Refresh live prices';btn.onclick=()=>loadLive();aside.append(st,btn);kh.append(aside);
  const tiles=el('div','tiles');tiles.id='tiles';kn.append(kh,tiles);app.append(kn);

  // 4. What changed + outlook
  const two=el('div','two');
  const ch=el('div','card');const u=el('ul','l');(r.changes||[]).forEach(x=>u.append(el('li',null,x)));ch.append(u);
  const ol=el('div','card');(r.outlook||[]).forEach(o=>{const row=el('div','olrow');const hz=el('div','hz',String(o.days));hz.append(el('small',null,'DAYS'));const ln=el('div','lean');ln.append(sig(o.signal),el('span',null,o.lean));row.append(hz,ln,el('p',null,o.text));ol.append(row)});
  two.append(section(prev?'What changed since '+fmtShort(prev.date):'Where things stand',ch),section('Outlook',ol));app.append(two);

  // 6. What would change the call
  const tr=el('div','three');
  const col=(t,s,arr)=>{const c=el('div','card');const h=el('h3');h.append(sig(s),el('span',null,t));const ul=el('ul','l');(arr||[]).forEach(x=>ul.append(el('li',null,x)));c.append(h,ul);return c};
  tr.append(col('More cautious if…','red',r.triggers?.red),col('Time to buy if…','green',r.triggers?.green),col('Long-shot risks','yellow',r.swans));
  app.append(section('What would change the call',tr));

  // 5. Street view
  if(r.street){
    const S=r.street,kids=[];
    if(S.consensus){const c=el('div','card cons');const pr=(a,b)=>{const d=el('div');d.append(el('span','lbl',a+' '),el('b',null,b||'—'));return d};c.append(pr('US stocks:',S.consensus.equities),pr('Treasuries:',S.consensus.treasuries));if(S.consensus.note)c.append(el('p','p',S.consensus.note));kids.push(c)}
    if(S.houses?.length){const g=el('div','firms');
      const hd=el('div','frow head');['Firm','US stocks','Treasuries','Fit with your call'].forEach(x=>hd.append(el('span','lbl',x)));g.append(hd);
      S.houses.forEach(h=>{const row=el('div','frow');if(h.change)row.title=h.change;
        const f=el('div','firm');f.append(h.link?link(h.firm+' ↗',h.link):el('b',null,h.firm));if(h.date)f.append(el('span','d',fmtShort(h.date)));
        const cell=(k,v)=>{const d=el('div');d.append(el('span','lbl mob',k),document.createTextNode(v||'—'));return d};
        const fc=el('div','fitc');if(h.fit)fc.append(el('span','chip '+h.fit,h.fitLabel||h.fit));if(h.fitNote)fc.append(el('span',null,h.fitNote));
        row.append(f,cell('Stocks',h.equities),cell('Treasuries',h.treasuries),fc);g.append(row)});
      kids.push(g)}
    if(S.voices?.length){const g=el('div','voices');S.voices.forEach(v=>{const c=el('div','card voice');c.append(el('p','q','“'+v.quote+'”'));const w=el('div','who');w.append(v.link?link(v.who+' ↗',v.link):document.createTextNode(v.who),document.createTextNode(v.date?' · '+fmtShort(v.date):''));c.append(w);if(v.context)c.append(el('p',null,v.context));g.append(c)});kids.push(g)}
    if(S.note)kids.push(el('p','small-note',S.note));
    app.append(section('What Wall Street is saying',...kids));
  }

  // 7. Detail (collapsed)
  const det=el('details','more');const sm=el('summary');const sl=el('span');sl.append(document.createTextNode('Full detail '),el('small',null,'· indicator board, macro factors, sources'));sm.append(sl);det.append(sm);
  const db=el('div','dbody');
  if(r.board?.length){const d=el('div');d.append(el('h3',null,'Indicator board'));const tw=el('div','tbl'),tb=el('table'),thd=el('thead'),hr=el('tr');['Indicator','Latest',prev?'vs '+fmtShort(prev.date):'Change','Signal'].forEach(x=>hr.append(el('th',null,x)));thd.append(hr);
    const bd=el('tbody');r.board.forEach(b=>{const row=el('tr');const ic=el('td');if(b.link)ic.append(link(b.indicator+' ↗',b.link));else ic.textContent=b.indicator;const sc=el('td');sc.append(el('span','chip '+b.signal,b.signal));row.append(ic,el('td','n',b.latest),el('td','n',b.change||'—'),sc);bd.append(row)});
    tb.append(thd,bd);tw.append(tb);d.append(tw);db.append(d)}
  if(r.macro?.length){const d=el('div');d.append(el('h3',null,'Macro factors'));const w=el('div','watch');r.macro.forEach(m=>{const c=el('div','w');c.append(sig(m.signal),el('b',null,m.name),el('p',null,m.note));w.append(c)});d.append(w);db.append(d)}
  if(r.sources?.length){const d=el('div');d.append(el('h3',null,'Sources'));const u2=el('ol','src');r.sources.forEach(s=>{const li=el('li');li.append(link(s.title,s.url));u2.append(li)});d.append(u2);db.append(d)}
  det.append(db);app.append(det);

  renderTiles();drawRuler();
}

let LIST=[];
async function getReport(date){const r=await fetch(`reports/${date}.json`,{cache:'no-cache'});if(!r.ok)throw 0;return r.json()}
async function loadReport(date){
  try{
    cur=await getReport(date);
    const i=LIST.findIndex(x=>x.date===date),p=LIST[i+1];
    prev=p?await getReport(p.date).catch(()=>null):null;
    render(cur);
  }catch(e){document.getElementById('app').replaceChildren(el('div','msg','Report '+date+' could not be loaded.'))}
}
const LIVE_MS=5*60*1000;
setInterval(()=>{if(document.visibilityState==='visible')loadLive()},LIVE_MS);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-liveAt>LIVE_MS)loadLive()});
(async()=>{
  loadLive();
  const pick=document.getElementById('pick');
  try{
    const r=await fetch('reports/index.json',{cache:'no-cache'});const idx=await r.json();
    const list=LIST=(idx.reports||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
    if(!list.length)throw 0;
    pick.replaceChildren();list.forEach(x=>{const o=el('option',null,fmtDate(x.date)+' · '+(x.label||'')+' · '+(x.powder||''));o.value=x.date;pick.append(o)});
    const want=location.hash.slice(1),sel=list.find(x=>x.date===want)?.date||list[0].date;pick.value=sel;loadReport(sel);
    pick.addEventListener('change',e=>{location.hash=e.target.value;loadReport(e.target.value);window.scrollTo({top:0})});
  }catch(e){pick.replaceChildren(el('option',null,'—'));document.getElementById('app').replaceChildren(el('div','msg','No reports yet. Reports post monthly, around the 20th.'))}
})();
