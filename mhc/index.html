<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Gregentic · Market Health Check</title>
<meta property="og:title" content="Gregentic · Market Health Check">
<meta property="og:description" content="A monthly one-page read on the market for a long-term investor: the overall signal, the dry-powder call, and what would change it.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1b2e;--bg2:#132338;--bg3:#172a42;
  --border:#264566;--accent:#38c4e3;--accent2:#22c55e;
  --text:#ecf4fc;--dim:#b4cbe0;--muted:#8eaac4;
  --green:#2ecc71;--yellow:#f5b031;--red:#ff6b6b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55}
a{color:var(--accent)}
a:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
#hdr{background:var(--bg2);border-bottom:2px solid var(--accent);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
#logo{font-family:var(--mono);color:var(--accent);font-size:18px;font-weight:bold;letter-spacing:4px;text-decoration:none}
#logo em{color:var(--accent2);font-style:normal}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hbtn{font-family:var(--mono);border:1px solid var(--border);color:var(--dim);font-size:13px;padding:6px 12px;letter-spacing:1px;text-decoration:none}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
select{background:var(--bg3);color:var(--text);border:1px solid var(--accent);cursor:pointer;font-family:var(--sans);font-size:15px;padding:6px 8px;max-width:100%}

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 28px;display:grid;gap:22px}
#app{display:grid;gap:22px}

/* section header */
.sh{font-family:var(--mono);font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);padding:0 0 8px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh .aside{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.blk{display:grid;gap:12px;align-content:start}
.two>.blk{grid-template-rows:auto 1fr}
.card{background:var(--bg2);border:1px solid var(--border);padding:18px 20px}
.lbl{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}

/* signal */
.sig{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.sig.green{background:var(--green)}.sig.yellow{background:var(--yellow)}.sig.red{background:var(--red)}
.chip{font-family:var(--mono);font-size:13px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border:1.5px solid currentColor;white-space:nowrap;display:inline-block}
.chip.green{color:var(--green)}.chip.yellow{color:var(--yellow)}.chip.red{color:var(--red)}.chip.acc{color:var(--accent)}

/* hero */
.hero{border-left:5px solid var(--yellow);display:grid;gap:12px}
.hero.green{border-left-color:var(--green)}.hero.red{border-left-color:var(--red)}
.kick{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.kick .lbl{color:var(--dim);font-size:13px}
.hero h1{font-size:30px;line-height:1.2;font-weight:700;max-width:38ch}
.hero .sum{font-size:18px;line-height:1.6;max-width:68ch}
.meta{font-size:14px;color:var(--muted)}

/* dry powder */
.pw-top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.pw-name{font-size:26px;font-weight:700}
.pw-chg{font-size:14px;color:var(--yellow)}
.pw-same{font-size:14px;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0 4px}
.rung{padding:9px 4px;background:var(--bg);border:1px solid var(--border);text-align:center;display:grid;gap:1px;min-width:0}
.rung b{font-family:var(--mono);font-size:14px;letter-spacing:.5px;color:var(--dim)}
.rung small{font-size:12px;color:var(--muted)}
.rung.on{background:var(--accent);border-color:var(--accent)}
.rung.on b,.rung.on small{color:#04121f}
.axis{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px;gap:10px}
.action{font-size:18px;line-height:1.55;max-width:68ch}
.dist{font-size:16px;color:var(--dim);margin-top:8px}
.ruler{margin:10px 0 2px}
.ruler svg{width:100%;height:auto;display:block}
.note{font-size:15px;color:var(--dim);border-top:1px dashed var(--border);padding-top:10px;margin-top:12px;max-width:72ch}
@media(max-width:520px){.rung b{font-size:13px}.rung small{display:none}.pw-name{font-size:22px}.hero h1{font-size:26px}#hdr{position:static}#pick-lbl{display:none}}

/* key numbers */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--bg2);border:1px solid var(--border);padding:14px 16px;display:grid;gap:4px;align-content:start;text-decoration:none;color:inherit;min-width:0}
.tile .name{font-size:15px;font-weight:600;color:var(--dim)}
a.tile:hover{background:var(--bg3)}
.tile .top{display:flex;align-items:center;gap:7px}
.tile .ext{margin-left:auto;color:var(--muted);font-size:13px}
.tile .v{font-family:var(--mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .dl{font-size:14px;color:var(--dim)}
.tile .s{font-size:14px;color:var(--dim);line-height:1.4}
.tile .now{font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px;margin-top:4px}
.spark{width:100%;height:30px;display:block}
.rf{background:none;border:1px solid var(--accent2);color:var(--accent2);font-family:var(--mono);font-size:12px;letter-spacing:1px;padding:3px 9px;cursor:pointer}
.rf:hover{background:var(--accent2);color:#04121f}
.rf[disabled]{opacity:.5;cursor:wait}
@media(max-width:400px){.tile .v{font-size:21px}}

/* two columns */
.interim .rg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.interim .rg h3{font-size:18px;margin:0}
.interim .rgt{font-size:15px;color:var(--dim);margin:0 0 14px;max-width:72ch}
.rrow{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:7px 0;border-top:1px dashed var(--border)}
.rrow .nm{font-size:14px;font-weight:600;color:var(--dim)}
.rrow .nums{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap;min-width:9.5em}
.rrow .rn{grid-column:1/-1;font-size:13px;color:var(--muted)}
.rbar{position:relative;height:14px}
.rbar .trk{position:absolute;left:0;right:0;top:6px;height:2px;background:var(--border)}
.rbar .st,.rbar .en{position:absolute;top:2px;width:10px;height:10px;border-radius:50%;margin-left:-5px}
.rbar .st{border:2px solid var(--muted);background:var(--bg2)}
.rbar .en{background:var(--accent)}
.rkey{font-size:12px;color:var(--muted);margin:2px 0 10px;display:flex;gap:14px;flex-wrap:wrap}
.rkey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ev{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:8px}
.ev li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;font-size:15px}
.ev .dt{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:2px}
.ev .tag{display:inline-block;margin-left:6px;font-size:12px;color:var(--yellow);border:1px solid var(--yellow);padding:0 6px;white-space:nowrap}
@media(max-width:520px){.rrow{grid-template-columns:1fr auto}.rrow .rbar{grid-column:1/-1;order:3}}


.overlay{border:1.5px dashed var(--accent);background:var(--bg3);padding:16px 18px;display:grid;gap:16px}
.ovh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ovh h2{margin:0;font-size:20px}
.ovh .pill{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--bg);background:var(--accent);padding:2px 8px;margin-right:10px;vertical-align:middle}
.ovh .aside{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.ovsub{font-size:14px;color:var(--muted);margin:-8px 0 0}
.ovblk h3{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:normal}
.nowtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:8px}
.nt{background:var(--bg2);border:1px solid var(--border);padding:10px 12px;display:grid;gap:2px;text-decoration:none;color:inherit;min-width:0}
.nt:hover{border-color:var(--accent)}
.nt .n{font-size:13px;color:var(--dim)}.nt .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.nt .d{font-size:13px;color:var(--dim)}
.rptdiv{display:flex;align-items:center;gap:12px;margin-top:8px}
.rptdiv::before,.rptdiv::after{content:"";flex:1;height:2px;background:var(--border)}
.rptdiv span{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;text-align:center;min-width:0}
.ovdet>summary{cursor:pointer;font-size:14px;color:var(--accent);list-style:none}
.ovdet>summary::-webkit-details-marker{display:none}
.ovdet>summary::before{content:'▸ ';}
.ovdet[open]>summary::before{content:'▾ ';}
.ovdet>.ovin{display:grid;gap:16px;margin-top:14px}
/* ── live layer ── */
.livebar{border:1px solid var(--border);border-left:5px solid var(--green);background:var(--bg2);padding:14px 18px;display:grid;gap:6px}
.livebar.watch{border-left-color:var(--yellow)}.livebar.attention{border-left-color:var(--red)}
.livebar .lt{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.livebar .lt b{font-size:18px}
.livebar .lk{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.livebar p{margin:0;font-size:15px;color:var(--dim);max-width:78ch}
.livebar .lm{font-size:13px;color:var(--muted)}
.pl{display:grid;gap:0}
.plrow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,1.6fr) minmax(150px,1fr);gap:4px 16px;align-items:center;padding:10px 0;border-top:1px dashed var(--border)}
.plrow:first-child{border-top:none}
.plrow .nm{font-weight:600;font-size:15px}
.plrow .ln{font-size:13px;color:var(--muted)}
.plrow .st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.plrow .st .chip{font-size:12px}
.plrow .st small{font-size:13px;color:var(--dim)}
.plrow .src{font-size:12px;color:var(--muted)}
.pbar{position:relative;height:30px}
.pbar .trk{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--border)}
.pbar .lin{position:absolute;top:6px;width:2px;height:18px;margin-left:-1px;background:var(--yellow)}
.pbar .lin.r{background:var(--red)}.pbar .lin.g{background:var(--green)}
.pbar .rp,.pbar .nw{position:absolute;top:9px;width:12px;height:12px;border-radius:50%;margin-left:-6px}
.pbar .rp{border:2px solid var(--muted);background:var(--bg2)}
.pbar .nw{background:var(--accent)}
.pbar .tx{position:absolute;top:-4px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;font-family:var(--mono)}
.pbar .mv{position:absolute;top:14px;height:2px;background:var(--accent);opacity:.75}
.pbar .mv::after{content:"";position:absolute;top:-5px;border-top:6px solid transparent;border-bottom:6px solid transparent}
.pbar .mv.r::after{right:5px;border-left:9px solid var(--accent)}
.pbar .mv.l::after{left:5px;border-right:9px solid var(--accent)}
.plrow .dir{font-size:13px;font-weight:600}
.plrow .dir.toward{color:var(--yellow)}.plrow .dir.away{color:var(--green)}.plrow .dir.thru{color:var(--red)}.plrow .dir.flat{color:var(--muted)}
.pbar{position:relative;height:46px}
.pbar .trk{top:22px}
.pbar .zone{position:absolute;top:12px;height:22px;border-radius:2px}
.pbar .zone.g{background:color-mix(in srgb,var(--green) 22%,transparent)}
.pbar .zone.r{background:color-mix(in srgb,var(--red) 22%,transparent)}
.pbar .zl{position:absolute;top:15px;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;white-space:nowrap;pointer-events:none}
.pbar .zl.g{color:var(--green)}.pbar .zl.r{color:var(--red)}
.pbar .lin{top:10px;height:26px}
.pbar .lv{position:absolute;top:-3px;font-size:11px;font-family:var(--mono);transform:translateX(-50%);white-space:nowrap;color:var(--dim)}
.pbar .ev{position:absolute;bottom:-4px;font-size:10px;font-family:var(--mono);color:var(--muted)}
.pbar .rp,.pbar .nw{top:17px}
.pbar .mv{top:22px}
.plrow .ln .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.plrow .ln .sw.g{background:color-mix(in srgb,var(--green) 55%,transparent)}.plrow .ln .sw.r{background:color-mix(in srgb,var(--red) 55%,transparent)}
.plrow .ln b{font-weight:600;color:var(--dim)}
.diag{border:1px solid var(--border);border-left:5px solid var(--green);background:var(--bg2);padding:14px 16px;display:grid;gap:6px;margin-bottom:16px}
.diag.yellow{border-left-color:var(--yellow)}.diag.red{border-left-color:var(--red)}
.diag .dk{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.diag .dn{font-size:22px;font-weight:700}
.diag .dp{margin:0;font-size:15px;color:var(--text);max-width:75ch}
.diag .dev{margin:4px 0 0;padding-left:18px;display:flex;flex-wrap:wrap;gap:2px 22px;font-size:13px;color:var(--dim)}
.grp{display:grid;gap:4px;margin-top:10px}
.grp .gh{font-weight:700;font-size:15px;color:var(--accent)}
.grp .gp{margin:0 0 6px;font-size:13px;color:var(--muted);max-width:75ch}
.plrow .q{font-size:12px;color:var(--accent);font-style:italic;margin-bottom:1px}
.plrow .cn{font-size:14px;color:var(--dim);text-align:center}
.chip.muted{color:var(--muted)}
.plintro{font-size:14px;color:var(--dim);margin:0 0 8px;max-width:72ch}
.plkey{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.plkey i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.wk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:8px;padding-top:12px;font-size:14px;color:var(--dim)}
.wk .dots{display:flex;gap:6px;flex-wrap:wrap}
.wk .d{font-family:var(--mono);font-size:12px;border:1px solid var(--border);padding:2px 7px;white-space:nowrap}
.wk .d.watch{border-color:var(--yellow)}.wk .d.attention{border-color:var(--red)}.wk .d.on-track{border-color:var(--green)}
@media(max-width:640px){.plrow{grid-template-columns:1fr}.plrow .st{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;text-align:left;gap:4px 10px}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
ul.l{padding-left:20px;display:grid;gap:9px;font-size:16px}
ul.l li::marker{color:var(--accent)}
.olrow{display:grid;grid-template-columns:62px 1fr;gap:2px 14px;padding:12px 0;border-bottom:1px solid var(--border)}
.olrow:first-child{padding-top:2px}.olrow:last-child{border-bottom:none}
.olrow .hz{grid-row:span 2;font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);line-height:1.1}
.olrow .hz small{display:block;font-size:12px;color:var(--muted);letter-spacing:1px;font-weight:normal}
.olrow .lean{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.olrow p{font-size:15px;color:var(--dim)}

/* street view */
.cons{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline}
.cons b{font-size:17px}
.cons .p{flex-basis:100%;font-size:15px;color:var(--dim)}
.firms{border:1px solid var(--border);background:var(--bg2)}
.frow{display:grid;grid-template-columns:1.2fr 1fr 1.3fr 1.7fr;gap:6px 18px;padding:13px 18px;border-bottom:1px solid var(--border);align-items:start;font-size:15px}
.frow:last-child{border-bottom:none}
.frow.head{padding:9px 18px;background:var(--bg3)}
.frow .firm a{font-weight:700;color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted)}
.frow .firm a:hover{color:var(--accent);border-color:var(--accent)}
.frow .firm .d{display:block;font-size:13px;color:var(--muted)}
.frow .fitc{display:grid;gap:5px;justify-items:start}
.frow .fitc .chip{font-size:12px}
.frow .fitc span:last-child{font-size:14px;color:var(--dim)}
.frow .mob{display:none}
@media(max-width:720px){.frow{grid-template-columns:1fr;gap:4px}.frow.head{display:none}.frow .mob{display:inline;margin-right:8px}}
.houses{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.house{display:grid;gap:8px;align-content:start}
.hh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.hh a,.hh b{font-size:17px;font-weight:700;color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted)}
.hh a:hover{color:var(--accent);border-color:var(--accent)}
.hh .d{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:15px;align-items:baseline}
.house p{font-size:15px;color:var(--dim)}
.q{font-style:italic;color:var(--text)!important;border-left:3px solid var(--border);padding-left:10px}
.fit{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--border);padding-top:9px;margin-top:2px}
.fit .chip{font-size:12px;flex:none}
.fit span:last-child{font-size:14px;color:var(--dim)}
.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.voice{display:grid;gap:6px;align-content:start}
.voice .q{font-size:17px}
.voice .who{font-size:14px;color:var(--muted)}
.voice p{font-size:15px;color:var(--dim)}
.small-note{font-size:14px;color:var(--muted)}

/* triggers */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:820px){.three{grid-template-columns:1fr}}
.three h3{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.three ul.l{font-size:15px}

/* detail */
details.more{border:1px solid var(--border);background:var(--bg2)}
details.more>summary{cursor:pointer;padding:14px 18px;font-family:var(--mono);font-size:14px;letter-spacing:1px;color:var(--accent);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'＋ SHOW'}
details.more[open]>summary::after{content:'－ HIDE'}
details.more>summary small{font-family:var(--sans);letter-spacing:0;color:var(--muted);font-size:13px}
.dbody{padding:4px 18px 18px;display:grid;gap:22px}
.dbody h3{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.watch{display:grid;gap:8px}
.w{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px}
.w .sig{margin-top:7px}
.w p{grid-column:2;color:var(--dim)}
.tbl{overflow-x:auto;border:1px solid var(--border)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}

<div class="wrap">
  <div id="app"><div class="msg">Loading report…</div></div>
  <div class="foot"><span>GREGENTIC.COM // MARKET HEALTH CHECK v2.0</span><span>A data read, not financial advice. Report values are as of each report date.</span></div>
</div>

<script>
const WORKER_URL='https://gregentic-data.lobbingr.workers.dev';
const LADDER=[{s:-2,n:'Deploy+',d:'aggressive'},{s:-1,n:'Deploy',d:'gradual'},{s:0,n:'Hold',d:'no change'},{s:1,n:'Build',d:'steady'},{s:2,n:'Build+',d:'aggressive'}];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sig=s=>el('span','sig '+(s||''));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS='http://www.w3.org/2000/svg';
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
const fmtShort=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtMonth=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
const link=(txt,href)=>{const a=el('a',null,txt);a.href=href;a.target='_blank';a.rel='noopener';return a};
function section(title,...kids){const s=el('section','blk');const h=el('div','sh');h.append(el('span',null,title));s.append(h,...kids);return s}

function sparkSvg(vals,color,label){
  if(!vals||vals.length<2)return null;
  const W=150,H=30,P=3,lo=Math.min(...vals),hi=Math.max(...vals),rg=hi-lo||1;
  const X=i=>P+i*(W-2*P)/(vals.length-1),Y=v=>H-P-(v-lo)/rg*(H-2*P);
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('class','spark');svg.setAttribute('role','img');svg.setAttribute('aria-label',label||'trend');
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const mk=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);svg.append(n)};
  mk('polygon',{points:`${X(0)},${H} ${pts} ${X(vals.length-1)},${H}`,fill:color,opacity:.12});
  mk('polyline',{points:pts,fill:'none',stroke:color,'stroke-width':1.5,'vector-effect':'non-scaling-stroke','stroke-linejoin':'round'});
  mk('circle',{cx:X(vals.length-1),cy:Y(vals.at(-1)),r:2.5,fill:color});
  return svg;
}

// ── INDICATORS (report snapshot + live) ──
const IND=[
  {key:'sp500',sym:'^GSPC',label:'S&P 500',kind:'pct',fmt:v=>v.toLocaleString('en-US',{maximumFractionDigits:0}),yh:'%5EGSPC'},
  {key:'y10',sym:'^TNX',label:'10-yr Treasury',kind:'pts',inv:true,fmt:v=>v.toFixed(2)+'%',yh:'%5ETNX'},
  {key:'y30',sym:'^TYX',label:'30-yr Treasury',kind:'pts',inv:true,fmt:v=>v.toFixed(2)+'%',yh:'%5ETYX'},
  {key:'bill13',sym:'^IRX',label:'Cash (13-wk bill)',kind:'pts',fmt:v=>v.toFixed(2)+'%',yh:'%5EIRX'},
  {key:'brent',sym:'BZ=F',label:'Brent oil',kind:'pct',inv:true,fmt:v=>'$'+v.toFixed(2),yh:'BZ%3DF'},
  {key:'btc',sym:'BTC-USD',label:'Bitcoin',kind:'pct',fmt:v=>'$'+Math.round(v).toLocaleString(),yh:'BTC-USD'},
  {key:'vix',sym:'^VIX',label:'VIX (fear gauge)',kind:'pct',inv:true,fmt:v=>v.toFixed(1),yh:'%5EVIX'}
];
const num=x=>typeof x==='number'?x:(x&&typeof x.v==='number'?x.v:null);
function chg(I,now,then){
  if(now==null||then==null)return null;
  const diff=I.kind==='pts'?(now-then):(now-then)/Math.abs(then)*100;
  const flat=Math.abs(diff)<(I.kind==='pts'?0.01:0.1);
  const txt=I.kind==='pts'?Math.abs(diff).toFixed(2)+' pts':Math.abs(diff).toFixed(1)+'%';
  return flat?'unchanged':(diff>0?'▲ ':'▼ ')+txt;
}

let live={},liveSeries={},cur=null,prev=null,liveBusy=false,liveAt=0,liveFull=false;
async function loadLive(){
  if(liveBusy)return;liveBusy=true;setLiveStatus('updating…');
  let full=false;
  try{
    const r=await fetch(`${WORKER_URL}/history`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();let n=0;
    IND.forEach(I=>{const s=d[I.sym];if(!s||s.error||!s.c?.length)return;n++;liveSeries[I.key]={...s,span:'52wk'};live[I.key]=s.price??s.c.at(-1)});
    if(!n)throw new Error('no series');full=true;
  }catch(e){
    await Promise.all([
      (async()=>{try{
        const r=await fetch(`${WORKER_URL}/markets`);if(!r.ok)return;const d=await r.json();
        [['^GSPC','sp500'],['BZ=F','brent'],['^TYX','y30']].forEach(([sym,key])=>{
          const res=d[sym]?.chart?.result?.[0];if(!res)return;
          const ts=res.timestamp||[],cl=res.indicators?.quote?.[0]?.close||[];
          const pts=ts.map((t,i)=>[t,cl[i]]).filter(p=>p[1]!=null);
          const price=res.meta?.regularMarketPrice??pts.at(-1)?.[1];if(price==null)return;
          liveSeries[key]={t:pts.map(p=>p[0]),c:pts.map(p=>p[1]),price,span:'7d'};live[key]=price;
        });
      }catch(_){}})(),
      (async()=>{try{
        const r=await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily');if(!r.ok)return;
        const d=await r.json();const pr=(d.prices||[]).filter((_,i,a)=>i%7===0||i===a.length-1);
        if(pr.length){liveSeries.btc={t:pr.map(p=>Math.floor(p[0]/1000)),c:pr.map(p=>p[1]),price:pr.at(-1)[1],span:'52wk'};live.btc=pr.at(-1)[1]}
      }catch(_){}})()
    ]);
  }
  liveFull=full;liveAt=Date.now();liveBusy=false;
  setLiveStatus();renderLiveLayer();
}
function liveStatusText(){
  const n=Object.keys(live).length;
  if(liveBusy)return 'updating…';
  if(!liveAt)return 'loading live prices…';
  if(!n)return 'live prices unavailable';
  const t=new Date(liveAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return `Live prices ${t}`+(liveFull?'':` (${n} of ${IND.length})`)+' · lines show 52 weeks';
}
function setLiveStatus(){const s=document.getElementById('live-st');if(s)s.textContent=liveStatusText();const b=document.getElementById('lv-btn');if(b)b.disabled=liveBusy}

// ── KEY NUMBERS: report value, change vs last report, live now ──
function renderTiles(){
  const box=document.getElementById('tiles');if(!box||!cur){setLiveStatus();return}
  box.replaceChildren();
  const S=cur.snapshot||{},P=prev?.snapshot||{};
  IND.forEach(I=>{
    const x=S[I.key],v=num(x);
    const t=el('a','tile');t.href=`https://finance.yahoo.com/quote/${I.yh}/`;t.target='_blank';t.rel='noopener';t.title='Open chart';
    const top=el('div','top');top.append(sig(x?.signal),el('span','name',I.label),el('span','ext','↗'));
    t.append(top,el('div','v',v==null?'n/a':I.fmt(v)));
    if(prev){const c=chg(I,v,num(P[I.key]));t.append(el('div','dl',c?c+' vs '+fmtShort(prev.date):'no earlier reading'))}
    if(x?.note)t.append(el('div','s',x.note));
    box.append(t);
  });
  setLiveStatus();
}


// ── LIVE LAYER: where things stand now vs this report, using the plan lines ──
let LOG={days:[],status:[]};
async function loadLog(){
  const months=new Set();const now=new Date();
  const start=cur?new Date(cur.date+'T12:00:00'):new Date(now.getFullYear(),now.getMonth()-1,1);
  for(let d=new Date(start.getFullYear(),start.getMonth(),1);d<=now;d.setMonth(d.getMonth()+1))months.add(d.toISOString().slice(0,7));
  const days=[],status=[];
  await Promise.all([...months].map(async m=>{try{const r=await fetch(`log/${m}.json`,{cache:'no-cache'});if(!r.ok)return;const j=await r.json();days.push(...(j.days||[]));status.push(...(j.status||[]))}catch(_){}}));
  days.sort((a,b)=>a.date.localeCompare(b.date));status.sort((a,b)=>a.date.localeCompare(b.date));
  LOG={days,status};
}
function logLatest(key){for(let i=LOG.days.length-1;i>=0;i--){const v=LOG.days[i][key];if(typeof v==='number')return{v,date:LOG.days[i].date}}return null}
function nowVal(key){
  if(typeof live[key]==='number')return{v:live[key],src:'live'};
  const l=logLatest(key);if(l)return{v:l.v,src:'log',date:l.date};
  return null;
}
const SEV={'on-track':0,watch:1,attention:2};
function planLines(){
  if(!cur)return[];
  const S=cur.snapshot||{};
  let ath=cur.pullback?.ath||null;
  LOG.days.forEach(d=>{if(typeof d.sp500==='number'&&d.sp500>ath)ath=d.sp500});
  if(typeof live.sp500==='number'&&ath&&live.sp500>ath)ath=live.sp500;
  const hy=nowVal('hy');const rows=[];
  let hyRep=null;LOG.days.forEach(d=>{if(d.date<=cur.date&&typeof d.hy==='number')hyRep=d.hy});
  const fmtI=v=>Math.round(v).toLocaleString(),pct=v=>v.toFixed(2)+'%',bp=v=>Math.round(v)+'bp',usd=v=>'$'+v.toFixed(0),vx=v=>v.toFixed(1);
  const sp=nowVal('sp500');
  if(ath){
    const bz=ath*0.9,mz=ath*0.8,credOK=!hy||hy.v<400;
    rows.push({name:'S&P buy zone',group:'trigger',q:'When does the plan act?',zone:'Buy zone',line:'Close ≤ '+fmtI(bz)+' (−10%), junk spreads < 400bp',lineV:bz,dir:'below',rep:num(S.sp500),now:sp,f:fmtI,
      state:sp?(sp.v<=bz?(credOK?'attention':'watch'):(sp.v<=ath*0.918?'watch':'on-track')):null,
      what:sp?(sp.v<=bz?(credOK?'Inside the buy zone; the plan points to Deploy':'Below the line, but credit is stressed'):((sp.v/bz-1)*100).toFixed(1)+'% above the line'):'',col:'g'});
    rows.push({name:'S&P major zone',group:'trigger',q:'When does the plan act more?',zone:'Major buy zone',line:'Close ≤ '+fmtI(mz)+' (−20%)',lineV:mz,dir:'below',rep:num(S.sp500),now:sp,f:fmtI,
      state:sp?(sp.v<=mz?'attention':(sp.v<=ath*0.816?'watch':'on-track')):null,
      what:sp?(sp.v<=mz?'Inside the major zone; the plan points to Deploy+':((sp.v/mz-1)*100).toFixed(1)+'% above the line'):'',col:'g'});
  }
  rows.push({name:'Junk spreads',group:'gauge',q:'Is credit cracking?',zone:'Stress zone',line:'above 400bp',lineV:400,dir:'above',rep:hyRep,now:hy,f:bp,
    state:hy?(hy.v>400?'attention':hy.v>=375?'watch':'on-track'):null,what:hy?(hy.v>400?'Credit stress line crossed':(400-hy.v).toFixed(0)+'bp below the line'):'No reading yet',col:'r'});
  const y=nowVal('y10');
  rows.push({name:'10-yr yield (high)',group:'gauge',q:'Is it a rate shock?',zone:'Stress zone',line:'above 5.50%',lineV:5.5,dir:'above',rep:num(S.y10),now:y,f:pct,
    state:y?(y.v>5.5?'attention':y.v>=5.4?'watch':'on-track'):null,what:y?(y.v>5.5?'Stress line crossed':(5.5-y.v).toFixed(2)+' pts below the line'):'',col:'r'});
  rows.push({name:'10-yr yield (low)',group:'gauge',q:'Are rates easing?',zone:'Easing zone',line:'below 4.75% (rates easing)',lineV:4.75,dir:'below',rep:num(S.y10),now:y,f:pct,
    state:y?(y.v<4.75?'attention':y.v<=4.85?'watch':'on-track'):null,what:y?(y.v<4.75?'Easing line crossed':(y.v-4.75).toFixed(2)+' pts above the line'):'',col:'g'});
  const v=nowVal('vix');
  rows.push({name:'VIX (fear gauge)',group:'gauge',q:'Is it panic?',zone:'Stress zone',line:'above 30',lineV:30,dir:'above',rep:num(S.vix),now:v,f:vx,
    state:v?(v.v>30?'attention':v.v>=25?'watch':'on-track'):null,what:v?(v.v>30?'Fear spike: above the stress line':(30-v.v).toFixed(1)+' below the line'):'',col:'r'});
  const b=nowVal('brent');
  rows.push({name:'Brent oil',group:'gauge',q:'Is it an oil shock?',zone:'Easing zone',line:'below $85 (oil pressure easing)',lineV:85,dir:'below',rep:num(S.brent),now:b,f:usd,
    state:b?(b.v<85?'attention':b.v<=89?'watch':'on-track'):null,what:b?(b.v<85?'Easing line crossed':'$'+(b.v-85).toFixed(0)+' above the line'):'',col:'g'});
  const u=nowVal('unrate');
  if(u)rows.push({name:'Unemployment',group:'gauge',q:'Is a recession starting?',zone:'Stress zone',line:'4.5% or higher',lineV:4.5,dir:'above',rep:null,now:u,f:v=>v.toFixed(1)+'%',
    state:u.v>=4.5?'attention':u.v>=4.4?'watch':'on-track',what:u.v>=4.5?'Stress line crossed':(4.5-u.v).toFixed(1)+' pts below the line',col:'r'});
  return rows;
}

// ── DIAGNOSIS: what kind of market is this? (same rulebook as the monthly report and the Saturday check) ──
function canary(){
  const b=nowVal('btc'),sp=nowVal('sp500'),S=cur?.snapshot||{};const br=num(S.btc),sr=num(S.sp500);
  if(!b||!sp||br==null||sr==null)return null;
  const bc=(b.v/br-1)*100,sc=(sp.v/sr-1)*100;
  let st,txt,cls;
  if(bc<=-25&&sc>-5){st='warning';cls='red';txt='Breaking down ahead of stocks: speculative money is leaving first'}
  else if(bc>=50){st='warning';cls='yellow';txt='Up 50%+ — froth, often late in a run'}
  else if(bc>=3&&sc<=-3){st='good';cls='green';txt='Recovering before stocks: an early all-clear sign'}
  else if(bc<sc-10){st='watch';cls='yellow';txt='Weaker than stocks: risk appetite fading faster'}
  else{st='ok';cls='green';txt=bc<0?'Falling with stocks, not ahead of them':'Moving with stocks'}
  return{st,cls,txt,bc,sc,now:b.v,rep:br};
}
function diagnose(){
  if(!cur)return null;
  const g=k=>nowVal(k)?.v,S=cur.snapshot||{};
  const sp=g('sp500'),hy=g('hy'),y10=g('y10'),vix=g('vix'),br=g('brent'),ur=g('unrate');
  let ath=cur.pullback?.ath||null;LOG.days.forEach(d=>{if(typeof d.sp500==='number'&&d.sp500>ath)ath=d.sp500});if(sp&&ath&&sp>ath)ath=sp;
  const dd=sp&&ath?(1-sp/ath)*100:null,brRep=num(S.brent);
  const ev=[];
  if(dd!=null)ev.push(`S&P ${dd.toFixed(1)}% below its record`);
  if(hy!=null)ev.push(hy>400?`credit stressed (${Math.round(hy)}bp)`:hy>=375?`credit wobbling (${Math.round(hy)}bp)`:`credit calm (${Math.round(hy)}bp)`);
  if(vix!=null)ev.push(vix>30?`panic high (VIX ${vix.toFixed(0)})`:vix>=25?`nerves elevated (VIX ${vix.toFixed(0)})`:`fear low (VIX ${vix.toFixed(0)})`);
  if(y10!=null)ev.push(y10>5.5?`yields spiking (${y10.toFixed(2)}%)`:`10-yr ${y10.toFixed(2)}%`);
  if(br!=null)ev.push(`Brent $${br.toFixed(0)}`);
  ev.push(ur!=null?(ur>=4.5?`unemployment ${ur.toFixed(1)}%: recession signal`:`unemployment ${ur.toFixed(1)}%`):'no recession signal in the data');
  const c=canary();if(c)ev.push('canary: '+c.txt.charAt(0).toLowerCase()+c.txt.slice(1));
  const oilShock=br!=null&&((brRep&&br>=brRep*1.15)||br>=115);
  let d;
  if(hy!=null&&hy>600)d={name:'Credit crunch',sev:'red',plan:'The buy zone is on hold. Keep building dry powder until spreads stop widening; don’t catch a falling knife.'};
  else if(hy!=null&&hy>400)d={name:'Credit stress',sev:'red',plan:'The buy-zone rule requires calm credit, so it is on hold. Keep building until spreads fall back under 400bp.'};
  else if(ur!=null&&ur>=4.5)d={name:'Recession forming',sev:'red',plan:'Expect a deeper drop. Deploy only in tranches, and lean on the major zone (−20%).'};
  else if(y10!=null&&y10>5.5)d={name:'Rate shock',sev:'red',plan:'Stocks and bonds fall together. Treat Bond Plus with care as “safe” dry powder; cash-like options hold up better.'};
  else if(oilShock)d={name:'Oil shock',sev:'yellow',plan:'Stagflation risk: inflation up, growth down. Cash tends to beat both funds until oil settles.'};
  else if(dd!=null&&dd>=10)d={name:'Sentiment correction',sev:'green',plan:'Credit is calm and no recession signal shows. This is the setup the buy-zone rule was written for: the plan points to Deploy — gradual. Your call.'};
  else if(dd!=null&&dd>=5)d={name:'Pullback',sev:'yellow',plan:'A normal dip with credit calm. Not yet in the buy zone; the plan is unchanged.'};
  else d={name:'Calm market',sev:'green',plan:'Stocks near their highs and nothing stressed underneath. The plan is unchanged.'};
  if(d.name==='Sentiment correction'&&hy!=null&&hy>=375)d.plan+=' Watch credit closely: spreads are near the 400bp line.';
  d.ev=ev;d.canary=c;return d;
}
function moveDir(r){
  if(!r.now||typeof r.rep!=='number')return null;
  const n=r.now.v,p=r.rep,L=r.lineV,up=n>p,ar=up?'▲':'▼';
  if(Math.abs(n-p)<Math.abs(L)*0.0005)return{cls:'flat',txt:'– little change since report'};
  const side=v=>r.dir==='below'?(v<=L):(v>L);
  if(side(n)&&!side(p))return{cls:'thru',txt:ar+' crossed the line since the report'};
  if(!side(n)&&side(p))return{cls:'away',txt:ar+' back across the line since the report'};
  const toward=Math.abs(n-L)<Math.abs(p-L);
  if(side(n))return toward?{cls:'away',txt:ar+' back toward the line'}:{cls:'thru',txt:ar+' deeper past the line'};
  return toward?{cls:'toward',txt:ar+' moving toward the line'}:{cls:'away',txt:ar+' moving away from the line'};
}
function pbar(r){
  const vals=[r.lineV,r.now?.v,r.rep].filter(x=>typeof x==='number');
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*0.25||Math.abs(hi)*0.03;lo-=pad;hi+=pad;
  const pct=x=>(x-lo)/(hi-lo)*100,pos=x=>pct(x).toFixed(1)+'%';
  const b=el('div','pbar');
  // shaded zone on the side the rule watches
  const lp=pct(r.lineV),z=el('div','zone '+r.col),zl=el('span','zl '+r.col,r.zone||'');
  if(r.dir==='below'){z.style.left='0';z.style.width=lp.toFixed(1)+'%';zl.style.left='4px'}
  else{z.style.left=lp.toFixed(1)+'%';z.style.right='0';zl.style.right='4px'}
  b.append(z,el('div','trk'));
  const L=el('span','lin '+(r.col||''));L.style.left=pos(r.lineV);b.append(L);
  const lv=el('span','lv',r.f(r.lineV));lv.style.left=pos(r.lineV);b.append(lv);
  const e1=el('span','ev',r.f(lo));e1.style.left='0';const e2=el('span','ev',r.f(hi));e2.style.right='0';b.append(e1,e2);
  if(r.now&&typeof r.rep==='number'&&Math.abs(r.now.v-r.rep)>1e-9){const a=Math.min(r.rep,r.now.v),zz=Math.max(r.rep,r.now.v);const m=el('span','mv '+(r.now.v>r.rep?'r':'l'));m.style.left=pos(a);m.style.width='calc('+pos(zz)+' - '+pos(a)+')';b.append(m)}
  if(typeof r.rep==='number'){const d=el('span','rp');d.style.left=pos(r.rep);d.title='Report day: '+r.f(r.rep);b.append(d)}
  if(r.now){const d=el('span','nw');d.style.left=pos(r.now.v);d.title='Now: '+r.f(r.now.v);b.append(d)}
  b.setAttribute('role','img');b.setAttribute('aria-label',`${r.name}: ${r.now?'now '+r.f(r.now.v):'no current value'}${typeof r.rep==='number'?', report day '+r.f(r.rep):''}, ${r.zone||'zone'} ${r.dir==='below'?'below':'above'} ${r.f(r.lineV)}`);
  return b;
}
const STATE_TXT={'on-track':'✅ On track',watch:'👀 Watch',attention:'⚠️ Needs attention'};
function renderLiveLayer(){
  const top=document.getElementById('livebar'),box=document.getElementById('plines');if(!cur||!top||!box)return;
  const rows=planLines(),known=rows.filter(r=>r.state);
  const worst=known.reduce((a,r)=>SEV[r.state]>SEV[a]?r.state:a,'on-track');
  const isLatest=LIST[0]?.date===cur.date;
  // banner
  top.className='livebar '+worst;top.replaceChildren();

// ── PULLBACK RULER (drawn at real pixel width so text stays readable on phones) ──
function ruler(p,Wpx,nowLevel){
  const W=Math.round(Math.max(300,Math.min(980,Wpx))),narrow=W<560,H=98,pad=narrow?18:36,minPct=-25;
  const x=v=>pad+(v-minPct)/(0-minPct)*(W-2*pad);
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const dd=(p.level/p.ath-1)*100;svg.setAttribute('role','img');svg.setAttribute('aria-label',`S&P 500 is ${Math.abs(dd).toFixed(1)}% below its record high`);
  const add=(t,a,tx)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(tx!=null)n.textContent=tx;svg.append(n)};
  const G=css('--green'),Y=css('--yellow'),D=css('--dim'),M=css('--muted'),A=css('--accent'),B=css('--border'),F=css('--sans');
  add('rect',{x:x(-25),y:36,width:x(-20)-x(-25),height:14,fill:G,opacity:.6});
  add('rect',{x:x(-20),y:36,width:x(-10)-x(-20),height:14,fill:G,opacity:.3});
  add('rect',{x:x(-10),y:36,width:x(0)-x(-10),height:14,fill:css('--bg3')});
  const ticks=narrow?[-20,-10,0]:[-25,-20,-15,-10,-5,0];
  ticks.forEach(t=>{add('line',{x1:x(t),x2:x(t),y1:32,y2:54,stroke:B,'stroke-width':1.5});
    add('text',{x:x(t),y:71,'text-anchor':t===0?'end':'middle','font-size':13,fill:D,'font-family':F},t===0?'Record':t+'%');
    if(t<0)add('text',{x:x(t),y:89,'text-anchor':'middle','font-size':13,fill:M,'font-family':F},Math.round(p.ath*(1+t/100)).toLocaleString())});
  if(narrow)add('text',{x:(x(-25)+x(-10))/2,y:26,'text-anchor':'middle','font-size':13,fill:G,'font-family':F,'font-weight':'bold'},'BUY ZONE');
  else{add('text',{x:(x(-25)+x(-20))/2,y:26,'text-anchor':'middle','font-size':13,fill:G,'font-family':F,'font-weight':'bold'},'BUY MORE');
       add('text',{x:(x(-20)+x(-10))/2,y:26,'text-anchor':'middle','font-size':13,fill:G,'font-family':F,'font-weight':'bold'},'BUY ZONE')}
  const mx=x(Math.max(minPct,Math.min(0,dd)));
  const hasNow=typeof nowLevel==='number';
  if(hasNow){
    add('circle',{cx:mx,cy:43,r:6,fill:css('--bg2'),stroke:M,'stroke-width':2.5});
    const nd=(nowLevel/p.ath-1)*100,nx=x(Math.max(minPct,Math.min(0,nd)));
    add('line',{x1:nx,x2:nx,y1:30,y2:56,stroke:A,'stroke-width':3});add('circle',{cx:nx,cy:43,r:6,fill:A});
    add('text',{x:Math.min(nx+8,W-pad),y:26,'text-anchor':nx>W*0.6?'end':'start','font-size':13,fill:A,'font-family':F,'font-weight':'bold'},`Now ${Math.round(nowLevel).toLocaleString()} (${nd.toFixed(1)}%)`);
    add('title',{},`Report: ${Math.round(p.level).toLocaleString()} (${dd.toFixed(1)}%)`);
  }else{
    add('line',{x1:mx,x2:mx,y1:30,y2:56,stroke:A,'stroke-width':3});add('circle',{cx:mx,cy:43,r:6,fill:A});
    add('text',{x:Math.min(mx+8,W-pad),y:26,'text-anchor':mx>W*0.6?'end':'start','font-size':13,fill:A,'font-family':F,'font-weight':'bold'},`${Math.round(p.level).toLocaleString()} (${dd.toFixed(1)}%)`);
  }
  return svg;
}

  const db=el('div','dbody');
  if(r.board?.length){const d=el('div');d.append(el('h3',null,'Indicator board'));const tw=el('div','tbl'),tb=el('table'),thd=el('thead'),hr=el('tr');['Indicator','Latest',prev?'vs '+fmtShort(prev.date):'Change','Signal'].forEach(x=>hr.append(el('th',null,x)));thd.append(hr);
    const bd=el('tbody');r.board.forEach(b=>{const row=el('tr');const ic=el('td');if(b.link)ic.append(link(b.indicator+' ↗',b.link));else ic.textContent=b.indicator;const sc=el('td');sc.append(el('span','chip '+b.signal,b.signal));row.append(ic,el('td','n',b.latest),el('td','n',b.change||'—'),sc);bd.append(row)});
    tb.append(thd,bd);tw.append(tb);d.append(tw);db.append(d)}
  if(r.macro?.length){const d=el('div');d.append(el('h3',null,'Macro factors'));const w=el('div','watch');r.macro.forEach(m=>{const c=el('div','w');c.append(sig(m.signal),el('b',null,m.name),el('p',null,m.note));w.append(c)});d.append(w);db.append(d)}
  if(r.sources?.length){const d=el('div');d.append(el('h3',null,'Sources'));const u2=el('ol','src');r.sources.forEach(s=>{const li=el('li');li.append(link(s.title,s.url));u2.append(li)});d.append(u2);db.append(d)}
  det.append(db);app.append(det);

  renderTiles();renderLiveLayer();
}

let LIST=[];
async function getReport(date){const r=await fetch(`reports/${date}.json`,{cache:'no-cache'});if(!r.ok)throw 0;return r.json()}
async function loadReport(date){
  try{
    cur=await getReport(date);
    const i=LIST.findIndex(x=>x.date===date),p=LIST[i+1];
    prev=p?await getReport(p.date).catch(()=>null):null;
    await loadLog();
    render(cur);
  }catch(e){document.getElementById('app').replaceChildren(el('div','msg','Report '+date+' could not be loaded.'))}
}
const LIVE_MS=5*60*1000;
setInterval(()=>{if(document.visibilityState==='visible')loadLive()},LIVE_MS);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-liveAt>LIVE_MS)loadLive()});
(async()=>{
  loadLive();
  const pick=document.getElementById('pick');
  try{
    const r=await fetch('reports/index.json',{cache:'no-cache'});const idx=await r.json();
    const list=LIST=(idx.reports||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
    if(!list.length)throw 0;
    pick.replaceChildren();list.forEach(x=>{const o=el('option',null,fmtDate(x.date)+' · '+(x.label||'')+' · '+(x.powder||''));o.value=x.date;pick.append(o)});
    const want=location.hash.slice(1),sel=list.find(x=>x.date===want)?.date||list[0].date;pick.value=sel;loadReport(sel);
    pick.addEventListener('change',e=>{location.hash=e.target.value;loadReport(e.target.value);window.scrollTo({top:0})});
  }catch(e){pick.replaceChildren(el('option',null,'—'));document.getElementById('app').replaceChildren(el('div','msg','No reports yet. Reports post monthly, around the 20th.'))}
})();
</script>
